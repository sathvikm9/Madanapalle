services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tracker:${POSTGRES_PASSWORD:-tracker}@postgres:5432/tracker
      PORT: 8787
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      HEADLESS: ${HEADLESS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CAPTURE_AGENT_TOKEN: ${CAPTURE_AGENT_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8787:8787"
    volumes:
      - browser-data:/app/playwright-data

volumes:
  postgres-data:
  browser-data:
